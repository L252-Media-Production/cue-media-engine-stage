# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# The generated CueMEStage.xcodeproj is not committed.
name: CueMEStage

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Engine:
    path: Packages/Engine
  StageKit:
    path: Packages/StageKit

targets:
  CueMEStage:
    type: application
    platform: macOS
    sources:
      - path: Apps/CueMEStage
        excludes:
          - Resources/Fonts
          - Info.plist
      # Folder reference: the fonts and their OFL licence land in Contents/Resources/Fonts/ (see BundledFonts.swift).
      - path: Apps/CueMEStage/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Engine
      - package: StageKit
    # Document types and the three exported UTIs, declared once. xcodegen writes Apps/CueMEStage/Info.plist from
    # this; Xcode merges it with the generated keys (GENERATE_INFOPLIST_FILE).
    info:
      path: Apps/CueMEStage/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: CueME Stage Studio
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.l252mp.cuemestage.studio]
          - CFBundleTypeName: CueME Stage Studio Bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.l252mp.cuemestage.studio-bundle]
          - CFBundleTypeName: CueME Stage Items
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.l252mp.cuemestage.item]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.l252mp.cuemestage.studio
            UTTypeDescription: CueME Stage Studio
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [stg]
          - UTTypeIdentifier: com.l252mp.cuemestage.studio-bundle
            UTTypeDescription: CueME Stage Studio Bundle
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [stgbundle]
          - UTTypeIdentifier: com.l252mp.cuemestage.item
            UTTypeDescription: CueME Stage Items
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [stgitem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l252mp.cuemestage
        # The mockup's green (Resources/Assets.xcassets/AccentColor, = ThemeTokens.accent) for AppKit-drawn accents:
        # list selection, focus rings, default buttons. macOS uses it when the Mac's accent colour is Multicolor.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CueME Stage
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright L252 Media Production
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  CueMEStageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/CueMEStageTests
    dependencies:
      - target: CueMEStage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l252mp.cuemestage.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CueMEStage.app/Contents/MacOS/CueMEStage
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic

  StageEngine:
    type: tool
    platform: macOS
    sources:
      - Apps/StageEngine
      # The DeckLink SDK dispatch file loads Blackmagic's driver framework at run time. The 14.2.1
      # dispatch is used on purpose: it works with Desktop Video 14.x to 16.x drivers (see docs/sdk-setup.md).
      # Not committed; present only when the SDK has been copied into vendor/.
      - path: vendor/DeckLinkSDK/include/DeckLinkAPIDispatch_v14_2_1.cpp
        optional: true
    dependencies:
      - package: Engine
      - sdk: CoreVideo.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_NAME: StageEngine
        SWIFT_OBJC_BRIDGING_HEADER: Apps/StageEngine/DeckLink/StageEngine-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/DeckLinkSDK/include
          - $(SRCROOT)/vendor/NDISDK/include
          - $(SRCROOT)/Apps/StageEngine/NDI
          - $(SRCROOT)/Apps/StageEngine/DeckLink
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        # Hardened runtime blocks loading Blackmagic's driver framework (different signer).
        # For distribution this needs the disable-library-validation entitlement instead.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  CueMEStage:
    build:
      targets:
        CueMEStage: all
        CueMEStageTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CueMEStageTests
